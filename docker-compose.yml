services:

  # ── Event bus compartilhado entre Omni e Genie ────────────────────────────
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-p", "4222", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Banco de dados do Omni ────────────────────────────────────────────────
  # Separado do agent-db para isolar domínios
  omni-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omni
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: "${OMNI_DB_PASSWORD:-omni}"
    volumes:
      - omni-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Bridge WhatsApp ────────────────────────────────────────────────────────
  # PGSERVE_EMBEDDED=false: usa Postgres externo (omni-db) em vez do embutido
  # Elimina restricao de usuario root do initdb
  omni:
    build:
      context: .
      dockerfile: docker/omni/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: "8882"
      API_HOST: "0.0.0.0"
      NATS_URL: "nats://nats:4222"
      NATS_MANAGED: "false"
      PGSERVE_EMBEDDED: "false"
      DATABASE_URL: "postgresql://omni:${OMNI_DB_PASSWORD:-omni}@omni-db:5432/omni"
      OMNI_API_KEY: "${OMNI_API_KEY:-}"
    ports:
      - "8882:8882"
    depends_on:
      nats:
        condition: service_healthy
      omni-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8882/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # ── Banco de dados do agente (Due Diligence) ──────────────────────────────
  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: "${AGENT_DB_PASSWORD:-agent}"
    volumes:
      - agent-db-data:/var/lib/postgresql/data
      - ./docker/agent-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Orquestrador Claude ────────────────────────────────────────────────────
  # Roda como usuario nao-root (uid 1001) para o pgserve interno funcionar
  genie:
    build:
      context: .
      dockerfile: docker/genie/Dockerfile
    user: "1001:1001"
    environment:
      GENIE_HOME: /home/genie/.genie
      GENIE_NATS_URL: "nats:4222"
      GENIE_EXECUTOR: "sdk"
      OMNI_API_URL: "http://omni:8882"
      OMNI_API_KEY: "${OMNI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      DATABASE_URL: "postgres://agent:${AGENT_DB_PASSWORD:-agent}@agent-db:5432/agent"
    volumes:
      - genie-data:/home/genie/.genie
      - ./workspace:/workspace
      - ./tools:/tools
    depends_on:
      omni:
        condition: service_healthy
      agent-db:
        condition: service_healthy

volumes:
  omni-db-data:
  agent-db-data:
  genie-data:
